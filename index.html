<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vinhlt15.qti.vn</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }
        .tab-container {
            display: flex;
            align-items: center;
            background: #2c3e50;
            padding: 10px 20px 0;
            height: 45px;
            box-sizing: border-box;
            justify-content: space-between;
        }
        .tabs-left {
            display: flex;
        }
        .tab-button {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 5px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: 0.3s;
        }
        .tab-button:hover {
            background: #3b5998;
        }
        .tab-button.active {
            background: #ffffff;
            color: #2c3e50;
            font-weight: bold;
        }
        .marquee-right {
            width: 320px;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
            font-weight: bold;
            font-size: 15px;
            background: linear-gradient(45deg, #00ffcc, #ff007f, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        .content-container {
            width: 100%;
            height: calc(100vh - 45px);
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="tab-container">
        <!-- Các nút tab bên trái -->
        <div class="tabs-left">
            <!-- Các file báo cáo nội bộ hiển thị trực tiếp -->
            <button class="tab-button active" onclick="openTab(event, 'CLL.html')">CLL</button>
            <!-- Các file báo cáo nội bộ hiển thị trực tiếp -->
            <button class="tab-button active" onclick="openTab(event, 'RM.html')">RM</button>
            <!-- Link Sức Khỏe giữ nguyên nhúng trực tiếp trên trang để login -->
<button class="tab-button" onclick="window.open('https://ho.mypt.vn', '_blank')">Sức khoẻ</button>
        
            <!-- Các link hệ thống ngoài mở sang tab mới trên trình duyệt để đăng nhập bình thường -->
            <button class="tab-button" onclick="window.open('https://app.powerbi.com/groups/me/reports/0f0ed9e9-b093-4777-95ea-872c193b4625/736201893132557534e7?experience=power-bi', '_blank')">CongNo</button>
        </div>

        <!-- Dòng chữ chạy động bên phải -->
        <div class="marquee-right">
            <span class="marquee-text">🔥 FPT Telecom QTI - Vững Mạnh 🚀 Kinh Dịch Thuật!  🔥</span>
        </div>
    </div>

    <div class="content-container">
        <iframe id="reportFrame" src="CLL.html"></iframe>
    </div>

    <script>
        function openTab(evt, filename) {
            document.getElementById('reportFrame').src = filename;
            let buttons = document.getElementsByClassName("tab-button");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].className = buttons[i].className.replace(" active", "");
            }
            evt.currentTarget.className += " active";
        }
    </script>

</body>
</html>
